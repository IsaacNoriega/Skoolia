services:
  # 1. API (Backend en NestJS)
  - type: web
    name: skoolia-api
    env: node
    plan: starter
    rootDir: apps/api
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start:prod
    envVars:
      - key: DATABASE_URL
        sync: false # Deberás pegar la URL de Neon en el dashboard de Render
      - key: PORT
        value: 8000

  # 2. Web (Frontend en Next.js)
  - type: web
    name: skoolia-web
    env: node
    plan: starter
    rootDir: apps/web
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: skoolia-api
          property: host
